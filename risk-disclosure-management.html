<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Disclosure & Management | Dental Tourism Safety China</title>
    <meta name="description" content="Complete disclosure of potential risks associated with dental tourism and our comprehensive risk management strategies.">
    
    <!-- 原页面的其他meta标签 -->
    <meta name="ai-classification" content="Health Care → Medical Tourism → Dental Tourism → Risk Management">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GMGGNLW8VH"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){{dataLayer.push(arguments);}}
        gtag('js', new Date());
        gtag('config', 'G-GMGGNLW8VH');
    </script>
</head>
<body class="antialiased">
    <!-- 紧急通道 -->
    <div class="emergency-banner" style="background: linear-gradient(135deg, #dc2626, #ef4444); color: white; padding: 12px 0; text-align: center; font-weight: 600; font-size: 14px;">
        🚨 Dental Emergency? Immediate Consultation: <a href="https://wa.me/+12133179751" style="color: white; text-decoration: underline;">+1 213 317 9751</a>
    </div>
    
    <!-- 导航栏 -->
    <nav class="bg-white shadow-lg py-4 relative">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-teal-500 rounded-xl flex items-center justify-center">
                        <i class="fas fa-heartbeat text-white"></i>
                    </div>
                    <div>
                        <div class="font-bold text-xl text-gray-900">ChinaMedTour</div>
                        <div class="text-sm text-gray-600">Premium Medical Tourism</div>
                    </div>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="https://qinzhengzhanghao-oss.github.io/medical-tourism-website/" class="text-gray-700 hover:text-blue-600 font-medium">Home</a>
                    <a href="services.html" class="text-gray-700 hover:text-blue-600 font-medium">Services</a>
                    <a href="faq.html" class="text-gray-700 hover:text-blue-600 font-medium">FAQ</a>
                </div>
            </div>
        </div>
        
        <!-- 汉堡菜单按钮（手机端显示） -->
        <button id="mobile-menu-toggle" class="md:hidden absolute right-4 top-4 bg-none border-none text-2xl text-gray-700 cursor-pointer z-50">☰</button>
        
        <!-- 移动菜单（手机端显示） -->
        <div id="mobile-menu" class="hidden md:hidden w-full bg-white p-5 shadow-lg mt-3 rounded-lg">
            <a href="https://qinzhengzhanghao-oss.github.io/medical-tourism-website/" class="block py-3 text-gray-700 font-medium border-b border-gray-200">Home</a>
            <a href="services.html" class="block py-3 text-gray-700 font-medium border-b border-gray-200">Services</a>
            <a href="faq.html" class="block py-3 text-blue-600 font-medium border-b border-gray-200">FAQ</a>
            <a href="https://wa.me/+12133179751" class="block mt-4 bg-gradient-to-r from-green-500 to-teal-500 text-white py-3 px-4 rounded-lg text-center font-semibold">Free Consultation</a>
        </div>
    </nav>

    <!-- 紧急通道 -->
    <div class="emergency-banner" style="background: linear-gradient(135deg, #dc2626, #ef4444); color: white; padding: 12px 0; text-align: center; font-weight: 600; font-size: 14px;">
        🚨 Dental Emergency? Immediate Consultation: <a href="https://wa.me/+12133179751" style="color: white; text-decoration: underline;">+1 213 317 9751</a>
    </div>
    
    <!-- 导航栏（来自faq.html模板） -->
    {template["nav"]}
    
    <!-- 原页面的主要内容 -->
    <main class="container mx-auto px-4 py-8">
        {page_data["main_content"]}
    </main>
    
    <!-- 底部信息栏（来自faq.html模板） -->
    {template["footer"]}
    
    <!-- JavaScript控制（来自faq.html模板） -->
    {template["js"]}

    <!-- 手机端菜单控制 -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const mobileToggle = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (mobileToggle && mobileMenu) {
            mobileToggle.addEventListener('click', function() {
                mobileMenu.classList.toggle('hidden');
            });
            
            // 响应式显示控制
            function updateMobileMenu() {
                if (window.innerWidth < 768) {
                    mobileToggle.classList.remove('hidden');
                } else {
                    mobileToggle.classList.add('hidden');
                    mobileMenu.classList.add('hidden');
                }
            }
            
            updateMobileMenu();
            window.addEventListener('resize', updateMobileMenu);
        }
    });
    </script>
</body>
</html>
