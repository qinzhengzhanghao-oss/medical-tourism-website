/* 响应式设计基础 */
* {
    box-sizing: border-box;
}

/* 移动端优先 */
body {

    line-height: 1.6;
    margin: 0;

/* 容器响应式 */
.container {

/* 响应式网格 */
.row {

}

.col {

}

/* 媒体查询 - 平板 */
@media (min-width: 768px) {

}

/* 媒体查询 - 桌面 */
@media (min-width: 992px) {

/* 响应式图片 */
.img-responsive {

}

/* 响应式表格 */
.table-responsive {

}

/* 触摸友好按钮 */

/* 防止移动端缩放问题 */
input, select, textarea {
